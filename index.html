<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koova Spoke Calculator – S10/S60/S10B/S60B Hubs</title>
    <meta name="description" content="Free Koova spoke length calculator for S10, S10B, S60 & S60B hubs. Accurate J-bend and straight-pull spoke calculations in seconds.">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
            background:#fff;color:#1a1a1a;line-height:1.6
        }
        .container{max-width:1400px;margin:0 auto;padding:40px 20px}
        .calc-container{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:50px;
            margin-top:20px
        }
        @media(max-width:992px){.calc-container{grid-template-columns:1fr;gap:40px}}
        
        .calc-side{
            background:#fafafa;
            padding:40px;
            border-radius:4px;
            border:1px solid #e8e8e8
        }
        .calc-side h2{
            font-size:24px;
            font-weight:600;
            text-align:center;
            margin-bottom:20px;
            padding-bottom:12px;
            border-bottom:3px solid #ec7120
        }
        .form-group{margin-bottom:22px}
        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:500;
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:0.5px;
            color:#333
        }
        .form-group input,
        .form-group select{
            width:100%;
            padding:12px 14px;
            border:1px solid #d4d4d4;
            border-radius:4px;
            font-size:15px;
            background:#fff
        }
        .form-group input:focus,
        .form-group select:focus{
            outline:none;
            border-color:#ec7120;
            box-shadow:0 0 0 3px rgba(236,113,32,0.1)
        }
        .radio-group{
            display:flex;
            justify-content:center;
            gap:30px;
            padding:16px;
            background:#fff;
            border:1px solid #e0e0e0;
            border-radius:4px;
            margin-bottom:22px
        }
        @media(max-width:480px){.radio-group{flex-direction:column;gap:12px}}
        
        .result-box{
            background:linear-gradient(135deg,#ec7120,#d66318);
            color:#fff;
            padding:35px;
            border-radius:4px;
            text-align:center;
            margin-top:30px
        }
        .result-box h3{
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:1.5px;
            opacity:0.9;
            margin-bottom:12px
        }
        .result-box .result-value{
            font-size:52px;
            font-weight:700;
            letter-spacing:-1.5px
        }
        .result-box .result-unit{
            font-size:20px;
            opacity:0.85;
            margin-left:4px
        }
        @media(max-width:768px){
            .container{padding:30px 15px}
            .calc-side{padding:30px}
            .result-box .result-value{font-size:44px}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calc-container">
            <!-- Drive Side -->
            <div class="calc-side">
                <h2>Drive Side</h2>
                <div class="radio-group">
                    <label><input type="radio" name="spokeTypeR" value="jbend" checked onchange="onSpokeTypeChange('R')"> J-Bend</label>
                    <label><input type="radio" name="spokeTypeR" value="straight" onchange="onSpokeTypeChange('R')"> Straight Pull</label>
                </div>
                <div class="form-group"><label>Hub Model</label>
                    <select id="hubModelR" onchange="onHubModelChange('R')">
                        <option value="custom</option>
                        <option value="s10f">S10 Front</option>
                        <option value="s10r">S10 Rear</option>
                        <option value="s10bf">S10B Front</option>
                        <option value="s10br">S10B Rear</option>
                        <option value="s60f">S60 Front</option>
                        <option value="s60r">S60 Rear</option>
                        <option value="s60bf">S60B Front</option>
                        <option value="s60br">S60B Rear</option>
                    </select>
                </div>
                <div class="form-group"><label>ERD (mm)</label><input type="number" id="erdR" step="0.1" value="622" oninput="calculate()"></div>
                <div class="form-group"><label>Spoke Count</label><input type="number" id="spokeCountR" value="28" oninput="calculate()"></div>
                <div class="form-group"><label>Cross Pattern</label><input type="number" id="crossR" value="3" oninput="calculate()"></div>
                <div class="form-group"><label>Spoke Diameter (mm)</label><input type="number" id="spokeDimR" step="0.1" value="2.0" oninput="calculate()"></div>
                <div class="form-group"><label>Flange PCD (mm)</label><input type="number" id="pcdR" step="0.1" value="56.2" oninput="calculate()"></div>
                <div class="form-group"><label>Flange Offset (mm)</label><input type="number" id="offsetR" step="0.1" value="37" oninput="calculate()"></div>
                <div class="form-group" id="centerOffsetRGroup" style="display:none"><label>Center Offset (mm)</label><input type="number" id="centerOffsetR" step="0.1" value="0" oninput="calculate()"></div>
                <div class="result-box">
                    <h3>Spoke Length</h3>
                    <div class="result-value" id="resultR">--<span class="result-unit">mm</span></div>
                </div>
            </div>

            <!-- Non-Drive Side -->
            <div class="calc-side">
                <h2>Non-Drive Side</h2>
                <div class="radio-group">
                    <label><input type="radio" name="spokeTypeL" value="jbend" checked onchange="onSpokeTypeChange('L')"> J-Bend</label>
                    <label><input type="radio" name="spokeTypeL" value="straight" onchange="onSpokeTypeChange('L')"> Straight Pull</label>
                </div>
                <div class="form-group"><label>Hub Model</label>
                    <select id="hubModelL" onchange="onHubModelChange('L')">
                        <option value="custom">Custom / User Define</option>
                        <option value="s10f">S10 Front</option>
                        <option value="s10r">S10 Rear</option>
                        <option value="s10bf">S10B Front</option>
                        <option value="s10br">S10B Rear</option>
                        <option value="s60f">S60 Front</option>
                        <option value="s60r">S60 Rear</option>
                        <option value="s60bf">S60B Front</option>
                        <option value="s60br">S60B Rear</option>
                    </select>
                </div>
                <div class="form-group"><label>ERD (mm)</label><input type="number" id="erdL" step="0.1" value="622" oninput="calculate()"></div>
                <div class="form-group"><label>Spoke Count</label><input type="number" id="spokeCountL" value="28" oninput="calculate()"></div>
                <div class="form-group"><label>Cross Pattern</label><input type="number" id="crossL" value="3" oninput="calculate()"></div>
                <div class="form-group"><label>Spoke Diameter (mm)</label><input type="number" id="spokeDimL" step="0.1" value="2.0" oninput="calculate()"></div>
                <div class="form-group"><label>Flange PCD (mm)</label><input type="number" id="pcdL" step="0.1" value="56.2" oninput="calculate()"></div>
                <div class="form-group"><label>Flange Offset (mm)</label><input type="number" id="offsetL" step="0.1" value="22" oninput="calculate()"></div>
                <div class="form-group" id="centerOffsetLGroup" style="display:none"><label>Center Offset (mm)</label><input type="number" id="centerOffsetL" step="0.1" value="0" oninput="calculate()"></div>
                <div class="result-box">
                    <h3>Spoke Length</h3>
                    <div class="result-value" id="resultL">--<span class="result-unit">mm</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const hubPresets = {
            's10f':  { pcdL:56.2, offsetL:22,   offsetR:37,   pcdR:56.2, centerL:0, centerR:0, type:'jbend' },
            's10r':  { pcdL:56.2, offsetL:35,   offsetR:19.5, pcdR:56.2, centerL:0, centerR:0, type:'jbend' },
            's10bf': { pcdL:56.2, offsetL:26.5, offsetR:42,   pcdR:56.2, centerL:0, centerR:0, type:'jbend' },
            's10br': { pcdL:56.2, offsetL:38,   offsetR:22.5, pcdR:56.2, centerL:0, centerR:0, type:'jbend' },
            's60f':  { pcdL:38.7, offsetL:22.8, offsetR:32.9, pcdR:56.2, centerL:1.5,centerR:1.5,type:'straight'},
            's60r':  { pcdL:38.7, offsetL:36.1, offsetR:16.7, pcdR:56.2, centerL:1.5,centerR:1.5,type:'straight'},
            's60bf': { pcdL:38.7, offsetL:22.8, offsetR:38,   pcdR:56.2, centerL:2,  centerR:2,  type:'straight'},
            's60br': { pcdL:38.7, offsetL:39.1, offsetR:21.9, pcdR:56.2, centerL:2,  centerR:2,  type:'straight'}
        };

        let debounceTimer = null;

        function onHubModelChange(side) {
            const model = document.getElementById('hubModel'+side).value;
            if (model === 'custom') { enableUserInputMode(side); return; }
            const p = hubPresets[model];
            if (!p) return;

            document.getElementById('pcd'+side).value   = side==='L' ? p.pcdL : p.pcdR;
            document.getElementById('offset'+side).value = side==='L' ? p.offsetL : p.offsetR;
            document.getElementById('centerOffset'+side).value = side==='L' ? p.centerL : p.centerR;

            const isStraight = p.type === 'straight';
            document.querySelectorAll(`input[name="spokeType${side}"]`)[isStraight?1:0].checked = true;

            document.getElementById('pcd'+side).disabled = true;
            document.getElementById('offset'+side).disabled = true;
            document.getElementById('centerOffset'+side).disabled = true;

            onSpokeTypeChange(side);
            calculate();
        }

        function enableUserInputMode(side) {
            ['pcd','offset','centerOffset','cross'].forEach(f => {
                document.getElementById(f+side).disabled = false;
            });
        }

        function onSpokeTypeChange(side) {
            const isStraight = document.querySelector(`input[name="spokeType${side}"]:checked`).value === 'straight';
            document.getElementById('centerOffset'+side+'Group').style.display = isStraight ? 'block' : 'none';
            const crossInput = document.getElementById('cross'+side);
            if (isStraight) {
                const count = parseFloat(document.getElementById('spokeCount'+side).value) || 28;
                crossInput.value = count < 27 ? 2 : 3;
                crossInput.disabled = true;
            } else crossInput.disabled = false;
            calculate();
        }

        function calculate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(calculateSpokeLengths, 100);
        }

        function calculateSpokeLengths() {
            const left  = readSide('L');
            const right = readSide('R');
            updateResult('L', calculateLength(left));
            updateResult('R', calculateLength(right));
        }

        function readSide(side) {
            const isStraight = document.querySelector(`input[name="spokeType${side}"]:checked`).value === 'straight';
            return {
                isStraightPull: isStraight,
                erd:   parseFloat(document.getElementById('erd'+side).value) || 0,
                spokes: parseFloat(document.getElementById('spokeCount'+side).value) || 0,
                cross:  parseFloat(document.getElementById('cross'+side).value) || 0,
                holeDiameter: parseFloat(document.getElementById('spokeDim'+side).value) || 0,
                pcd:   parseFloat(document.getElementById('pcd'+side).value) || 0,
                flangeOffset: parseFloat(document.getElementById('offset'+side).value) || 0,
                centerOffset: parseFloat(document.getElementById('centerOffset'+side).value) || 0
            };
        }

        function updateResult(side, len) {
            const el = document.getElementById('result'+side);
            el.innerHTML = isNaN(len) ? '--<span class="result-unit">mm</span>' : len.toFixed(1) + '<span class="result-unit">mm</span>';
        }

        function calculateLength(p) {
            if (p.erd <= 0 || p.pcd <= 0 || p.spokes <= 0) return NaN;

            if (!p.isStraightPull) {
                const angleRad = (360 * p.cross * 2 / p.spokes) * Math.PI / 180;
                const c = Math.sqrt( Math.pow(p.erd/2,2) + Math.pow(p.pcd/2,2) - 2*(p.erd/2)*(p.pcd/2)*Math.cos(angleRad) );
                return Math.round( (Math.sqrt(c*c + p.flangeOffset*p.flangeOffset) - p.holeDiameter/2) * 10 ) / 10;
            } else {
                const effCross = p.cross + 0.5;
                const angle = 4 * Math.PI * effCross / p.spokes;
                const dx = p.erd/2 * Math.cos(angle) - p.pcd/2;
                const dy = p.erd/2 * Math.sin(angle);
                const length = Math.sqrt(dx*dx + dy*dy + p.flangeOffset*p.flangeOffset) + p.centerOffset;
                return Math.round(length * 10) / 10;
            }
        }

        window.onload = calculate;
    </script>
</body>
</html>
