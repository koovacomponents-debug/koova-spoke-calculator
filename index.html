<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koova Spoke Length Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 0;
        }
        
       .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
      }

        
        /* Calculator Grid */
        .calc-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 0;
        }
        
        .calc-side {
            background: #fafafa;
            padding: 25px;
            border-radius: 2px;
            border: 1px solid #e8e8e8;
            transition: box-shadow 0.3s ease;
        }
        
        .calc-side:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        
        .calc-side h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #000000;
            padding-bottom: 10px;
            border-bottom: 2px solid #ec7120;
            letter-spacing: 0.3px;
        }
        
        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #1a1a1a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4d4d4;
            border-radius: 2px;
            font-size: 14px;
            transition: all 0.2s ease;
            background: #ffffff;
            color: #1a1a1a;
            font-family: inherit;
        }
        
        .form-group input:hover,
        .form-group select:hover {
            border-color: #b8b8b8;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ec7120;
            box-shadow: 0 0 0 3px rgba(236, 113, 32, 0.1);
        }
        
        .form-group input:disabled {
            background: #f5f5f5;
            color: #999999;
            cursor: not-allowed;
            border-color: #e8e8e8;
        }
        
        /* Radio Group */
        .radio-group {
            margin-bottom: 16px;
            padding: 10px;
            background: #ffffff;
            border-radius: 2px;
            border: 1px solid #e0e0e0;
            display: flex;
            gap: 20px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 400;
            color: #1a1a1a;
            font-size: 13px;
            transition: color 0.2s;
            user-select: none;
        }
        
        .radio-group label:hover {
            color: #ec7120;
        }
        
        .radio-group input[type="radio"] {
            margin-right: 6px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ec7120;
        }
        
        /* Result Box */
        .result-box {
            background: linear-gradient(135deg, #ec7120 0%, #d66318 100%);
            color: #ffffff;
            padding: 18px;
            border-radius: 2px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 6px 16px rgba(236, 113, 32, 0.2);
        }
        
        .result-box h3 {
            margin: 0 0 8px 0;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .result-box .result-value {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        
        .result-box .result-unit {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.85;
            margin-left: 3px;
        }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .calc-container {
                gap: 25px;
            }
        }
        
        @media (max-width: 768px) {
            .calc-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .calc-side {
                padding: 20px;
            }
            
            .result-box .result-value {
                font-size: 32px;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calc-container">
            <!-- Drive Side -->
            <div class="calc-side">
                <h2>Drive Side</h2>
                
                <div class="radio-group">
                    <label>
                        <input type="radio" name="spokeTypeL" value="jbend" checked onchange="onSpokeTypeChange('L')">
                        J-Bend
                    </label>
                    <label>
                        <input type="radio" name="spokeTypeL" value="straight" onchange="onSpokeTypeChange('L')">
                        Straight Pull
                    </label>
                </div>

                <div class="form-group">
                    <label>Hub Model</label>
                    <select id="hubModelL" onchange="onHubModelChange('L')">
                        <option value="custom">Custom / User Define</option>
                        <option value="s10f">S10 Front</option>
                        <option value="s10r">S10 Rear</option>
                        <option value="s10bf">S10B Front</option>
                        <option value="s10br">S10B Rear</option>
                        <option value="s60f">S60 Front</option>
                        <option value="s60r">S60 Rear</option>
                        <option value="s60bf">S60B Front</option>
                        <option value="s60br">S60B Rear</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ERD (Effective Rim Diameter)</label>
                    <input type="number" id="erdL" step="0.1" value="622" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group">
                    <label>Spoke Count</label>
                    <input type="number" id="spokeCountL" value="28" oninput="calculate()">
                </div>

                <div class="form-group">
                    <label>Cross Pattern</label>
                    <input type="number" id="crossL" value="3" oninput="calculate()">
                </div>

                <div class="form-group">
                    <label>Spoke Diameter</label>
                    <input type="number" id="spokeDimL" step="0.1" value="2.0" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group">
                    <label>Flange PCD</label>
                    <input type="number" id="pcdL" step="0.1" value="56.2" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group">
                    <label>Flange Offset</label>
                    <input type="number" id="offsetL" step="0.1" value="22" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group" id="centerOffsetLGroup" style="display:none;">
                    <label>Center Offset</label>
                    <input type="number" id="centerOffsetL" step="0.1" value="0" oninput="calculate()" placeholder="mm">
                </div>

                <div class="result-box">
                    <h3>Spoke Length</h3>
                    <div class="result-value" id="resultL">--<span class="result-unit">mm</span></div>
                </div>
            </div>

            <!-- Non-Drive Side -->
            <div class="calc-side">
                <h2>Non-Drive Side</h2>
                
                <div class="radio-group">
                    <label>
                        <input type="radio" name="spokeTypeR" value="jbend" checked onchange="onSpokeTypeChange('R')">
                        J-Bend
                    </label>
                    <label>
                        <input type="radio" name="spokeTypeR" value="straight" onchange="onSpokeTypeChange('R')">
                        Straight Pull
                    </label>
                </div>

                <div class="form-group">
                    <label>Hub Model</label>
                    <select id="hubModelR" onchange="onHubModelChange('R')">
                        <option value="custom">Custom / User Define</option>
                        <option value="s10f">S10 Front</option>
                        <option value="s10r">S10 Rear</option>
                        <option value="s10bf">S10B Front</option>
                        <option value="s10br">S10B Rear</option>
                        <option value="s60f">S60 Front</option>
                        <option value="s60r">S60 Rear</option>
                        <option value="s60bf">S60B Front</option>
                        <option value="s60br">S60B Rear</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ERD (Effective Rim Diameter)</label>
                    <input type="number" id="erdR" step="0.1" value="622" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group">
                    <label>Spoke Count</label>
                    <input type="number" id="spokeCountR" value="28" oninput="calculate()">
                </div>

                <div class="form-group">
                    <label>Cross Pattern</label>
                    <input type="number" id="crossR" value="3" oninput="calculate()">
                </div>

                <div class="form-group">
                    <label>Spoke Diameter</label>
                    <input type="number" id="spokeDimR" step="0.1" value="2.0" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group">
                    <label>Flange PCD</label>
                    <input type="number" id="pcdR" step="0.1" value="56.2" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group">
                    <label>Flange Offset</label>
                    <input type="number" id="offsetR" step="0.1" value="37" oninput="calculate()" placeholder="mm">
                </div>

                <div class="form-group" id="centerOffsetRGroup" style="display:none;">
                    <label>Center Offset</label>
                    <input type="number" id="centerOffsetR" step="0.1" value="0" oninput="calculate()" placeholder="mm">
                </div>

                <div class="result-box">
                    <h3>Spoke Length</h3>
                    <div class="result-value" id="resultR">--<span class="result-unit">mm</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        <!-- 只展示关键修改部分：HTML input + JS，CSS无需改 -->

<!-- Cross Pattern 输入（左右都改） -->
<input type="number" id="crossL" value="3" oninput="markCrossEdited('L');calculate()">
<input type="number" id="crossR" value="3" oninput="markCrossEdited('R');calculate()">

<script>
var hubPresets = {
    's10f':  { pcdL: 56.2, offsetL: 22,   offsetR: 37,   pcdR: 56.2, centerL: 0, centerR: 0, type: 'jbend' },
    's10r':  { pcdL: 56.2, offsetL: 35,   offsetR: 19.5, pcdR: 56.2, centerL: 0, centerR: 0, type: 'jbend' },
    's10bf': { pcdL: 56.2, offsetL: 26.5, offsetR: 42,   pcdR: 56.2, centerL: 0, centerR: 0, type: 'jbend' },
    's10br': { pcdL: 56.2, offsetL: 38,   offsetR: 22.5, pcdR: 56.2, centerL: 0, centerR: 0, type: 'jbend' },
    's60f':  { pcdL: 38.7, offsetL: 22.8, offsetR: 32.9, pcdR: 56.2, centerL: 1.5, centerR: 1.5, type: 'straight' },
    's60r':  { pcdL: 38.7, offsetL: 36.1, offsetR: 16.7, pcdR: 56.2, centerL: 1.5, centerR: 1.5, type: 'straight' },
    's60bf': { pcdL: 38.7, offsetL: 22.8, offsetR: 38,   pcdR: 56.2, centerL: 2,   centerR: 2,   type: 'straight' },
    's60br': { pcdL: 38.7, offsetL: 39.1, offsetR: 21.9, pcdR: 56.2, centerL: 2,   centerR: 2,   type: 'straight' }
};

var debounceTimer = null;

/* ========= 用户行为记录 ========= */
function markCrossEdited(side) {
    document.getElementById('cross' + side).dataset.userEdited = true;
}

/* ========= Hub 选择 ========= */
function onHubModelChange(side) {
    var model = document.getElementById('hubModel' + side).value;

    if (model === 'custom') {
        enableUserInputMode(side);
        return;
    }

    var preset = hubPresets[model];
    if (!preset) return;

    var isLeft = (side === 'L');

    document.getElementById('pcd' + side).value = isLeft ? preset.pcdL : preset.pcdR;
    document.getElementById('offset' + side).value = isLeft ? preset.offsetL : preset.offsetR;
    document.getElementById('centerOffset' + side).value = isLeft ? preset.centerL : preset.centerR;

    document.getElementById('pcd' + side).disabled = true;
    document.getElementById('offset' + side).disabled = true;
    document.getElementById('centerOffset' + side).disabled = true;

    var radios = document.getElementsByName('spokeType' + side);
    var isStraight = preset.type === 'straight';
    radios[0].checked = !isStraight;
    radios[1].checked = isStraight;

    onSpokeTypeChange(side);
}

/* ========= 自定义模式 ========= */
function enableUserInputMode(side) {
    document.getElementById('pcd' + side).disabled = false;
    document.getElementById('offset' + side).disabled = false;
    document.getElementById('centerOffset' + side).disabled = false;
}

/* ========= 交叉数推荐逻辑 ========= */
function getRecommendedCross(spokes, isStraight) {
    if (isStraight) {
        if (spokes <= 24) return 1;
        if (spokes <= 28) return 2;
        return 2;
    } else {
        if (spokes <= 24) return 2;
        return 3;
    }
}

/* ========= Spoke 类型变化 ========= */
function onSpokeTypeChange(side) {
    var radios = document.getElementsByName('spokeType' + side);
    var isStraight = radios[1].checked;

    document.getElementById('centerOffset' + side + 'Group').style.display =
        isStraight ? 'block' : 'none';

    var crossInput = document.getElementById('cross' + side);
    var spokes = parseFloat(document.getElementById('spokeCount' + side).value) || 28;

    if (!crossInput.dataset.userEdited) {
        crossInput.value = getRecommendedCross(spokes, isStraight);
    }

    crossInput.disabled = false;

    calculate();
}

/* ========= 验证逻辑 ========= */
function validateCross(p) {
    if (p.cross < 0) return "Cross cannot be negative";

    if (p.cross > p.spokes / 2) {
        return "Cross too large";
    }

    if (p.isStraightPull && p.cross > 3) {
        return "Straight pull usually ≤2x";
    }

    return null;
}

/* ========= 计算入口 ========= */
function calculate() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(calculateSpokeLengths, 80);
}

/* ========= 主计算 ========= */
function calculateSpokeLengths() {
    var L = readSideParameters('L');
    var R = readSideParameters('R');

    var errL = validateCross(L);
    var errR = validateCross(R);

    var lenL = errL ? NaN : calculateLength(L);
    var lenR = errR ? NaN : calculateLength(R);

    renderResult('L', lenL, errL);
    renderResult('R', lenR, errR);
}

/* ========= 渲染 ========= */
function renderResult(side, length, error) {
    var el = document.getElementById('result' + side);

    if (error) {
        el.innerHTML = '<span style="font-size:12px;">⚠ ' + error + '</span>';
        return;
    }

    if (isNaN(length)) {
        el.innerHTML = '--<span class="result-unit">mm</span>';
        return;
    }

    el.innerHTML = length.toFixed(1) + '<span class="result-unit">mm</span>';
}

/* ========= 读取参数 ========= */
function readSideParameters(side) {
    var radios = document.getElementsByName('spokeType' + side);

    return {
        isStraightPull: radios[1].checked,
        erd: +document.getElementById('erd' + side).value || 0,
        spokes: +document.getElementById('spokeCount' + side).value || 0,
        cross: +document.getElementById('cross' + side).value || 0,
        holeDiameter: +document.getElementById('spokeDim' + side).value || 0,
        pcd: +document.getElementById('pcd' + side).value || 0,
        flangeOffset: +document.getElementById('offset' + side).value || 0,
        centerOffset: +document.getElementById('centerOffset' + side).value || 0
    };
}

/* ========= 核心计算 ========= */
function calculateLength(p) {
    if (p.erd <= 0 || p.pcd <= 0 || p.spokes <= 0) return NaN;

    if (!p.isStraightPull) {
        var angle = 2 * Math.PI * p.cross * 2 / p.spokes;
        var c = Math.sqrt(
            Math.pow(p.erd / 2, 2) +
            Math.pow(p.pcd / 2, 2) -
            2 * (p.erd / 2) * (p.pcd / 2) * Math.cos(angle)
        );
        return Math.sqrt(c * c + p.flangeOffset * p.flangeOffset) - p.holeDiameter / 2;
    } else {
        var effectiveCross = p.cross + 0.5;
        var angle = 4 * Math.PI * effectiveCross / p.spokes;

        var dx = p.erd / 2 * Math.cos(angle) - p.pcd / 2;
        var dy = p.erd / 2 * Math.sin(angle);

        return Math.sqrt(dx * dx + dy * dy + Math.pow(p.flangeOffset, 2)) + p.centerOffset;
    }
}

window.onload = calculate;
</script>
    </script>
</body>
</html>
